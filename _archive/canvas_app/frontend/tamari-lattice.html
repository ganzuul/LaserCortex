<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamari Lattice T₄ — Hasse Diagram</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #1a1a2e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-top: 0;
        color: #333;
        font-size: 24px;
      }
      .stats {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 4px;
      }
      .stat {
        display: flex;
        flex-direction: column;
      }
      .stat-label {
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
      }
      .stat-value {
        font-size: 20px;
        font-weight: bold;
        color: #333;
      }
      #root {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 600px;
      }
      .instructions {
        margin-top: 20px;
        padding: 15px;
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
        border-radius: 4px;
      }
      .instructions h3 {
        margin-top: 0;
        color: #1976d2;
      }
      .instructions ul {
        margin: 10px 0;
        padding-left: 20px;
      }
      .instructions li {
        margin: 5px 0;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Tamari Lattice T₄ — Hasse Diagram</h1>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Elements</span>
          <span class="stat-value">14</span>
        </div>
        <div class="stat">
          <span class="stat-label">Covering Relations</span>
          <span class="stat-value">21</span>
        </div>
        <div class="stat">
          <span class="stat-label">Max Rank</span>
          <span class="stat-value">6</span>
        </div>
        <div class="stat">
          <span class="stat-label">Rank Distribution</span>
          <span class="stat-value">1-3-3-3-2-1-1</span>
        </div>
      </div>
      <div id="root"></div>
      <div class="instructions">
        <h3>Instructions</h3>
        <ul>
          <li><strong>Pan:</strong> Click and drag the background</li>
          <li><strong>Zoom:</strong> Scroll wheel or pinch gesture</li>
          <li><strong>Select:</strong> Click a node to highlight it and its edges</li>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/tamari-lattice-entry.tsx"></script>
  </body>
</html>
