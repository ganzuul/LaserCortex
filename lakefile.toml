name = "LaserCortex"
version = "0.1.0"
defaultTargets = ["LaserCortex"]

[[lean_lib]]
name = "LaserCortex"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"

# Must come LAST so Mathlib's dependency pins take precedence
# (required by `lake exe cache get` hash computation).
[[require]]
name = "mathlib"
path = ".lake/packages/mathlib4"
